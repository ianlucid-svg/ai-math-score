<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>수행평가 점수 확인</title>
<script>document.write('<script src="config.js?t='+Date.now()+'"><\/script>');</script>
<style>
  :root{
    --ink:#1b2233; --sub:#5b6478; --line:#d9deea; --soft:#f3f5fa; --bg:#eef1f7;
    --accent:#2f4fd8; --accent-ink:#ffffff; --ok:#14866d; --no:#c2410c; --head:#e8ecf8;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    color:var(--ink); background:var(--bg); line-height:1.5;
    -webkit-text-size-adjust:100%; word-break:keep-all;
  }
  button{font:inherit;cursor:pointer}
  .wrap{max-width:760px;margin:0 auto;padding:16px 14px 40px}
  .hidden{display:none !important}

  /* ---------- 로그인 ---------- */
  #login{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:#fff;border-radius:var(--radius);box-shadow:0 6px 24px rgba(27,34,51,.08);padding:28px 22px;width:100%;max-width:400px}
  .card h1{font-size:1.25rem;margin:0 0 4px}
  .card .sub{color:var(--sub);font-size:.86rem;margin:0 0 22px}
  label{display:block;font-size:.9rem;font-weight:600;margin:14px 0 6px}
  input[type=text],input[type=password]{
    width:100%;font-size:16px;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);
  }
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,79,216,.15)}
  .pw{position:relative}
  .pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--sub);font-size:.82rem;padding:6px}
  .hint{font-size:.8rem;color:var(--sub);margin-top:6px}
  .btn{display:block;width:100%;border:0;border-radius:10px;padding:14px;font-size:1rem;font-weight:700;background:var(--accent);color:var(--accent-ink)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  #loginBtn{margin-top:22px}
  .err{color:#c62828;font-size:.86rem;min-height:1.3em;margin-top:10px}

  /* ---------- 상단 바 ---------- */
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .topbar .who{font-size:.85rem;color:var(--sub)}
  .ghost{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:.82rem;color:var(--sub)}

  /* ---------- 결과 시트 (캡처 대상) ---------- */
  #sheet{background:#fff;border-radius:var(--radius);padding:22px 18px 24px;box-shadow:0 6px 24px rgba(27,34,51,.06)}
  .sheet-title{text-align:center;margin-bottom:18px}
  .sheet-title h1{font-size:1.2rem;margin:0}
  .sheet-title p{margin:4px 0 0;color:var(--sub);font-size:.8rem}
  h2{font-size:.95rem;margin:20px 0 8px;display:flex;align-items:center;gap:6px}
  h2::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--accent)}

  table{width:100%;border-collapse:collapse;font-size:.92rem;table-layout:fixed}
  th,td{border:1px solid var(--line);padding:10px 6px;text-align:center;vertical-align:middle}
  th{background:var(--head);font-weight:700;font-size:.85rem}
  td.title{text-align:left;padding-left:10px}
  .score{font-weight:800;color:var(--accent);font-size:1rem}
  .pending{color:var(--sub);font-size:.8rem;font-weight:500}
  tr.total td{background:var(--soft);font-weight:800}
  .view{border:1px solid var(--accent);color:var(--accent);background:#fff;border-radius:7px;padding:5px 10px;font-size:.82rem;font-weight:600;white-space:nowrap}
  .view:disabled{border-color:var(--line);color:#a0a7b8;background:var(--soft);cursor:default}
  .note{font-size:.78rem;color:var(--sub);margin:8px 2px 0}

  /* 열 너비 */
  col.c-no{width:12%} col.c-name{width:auto} col.c-max{width:13%} col.c-score{width:15%} col.c-view{width:17%}

  /* ---------- 확인 영역 ---------- */
  .confirm{margin-top:22px;border:1px solid var(--line);border-radius:12px;padding:16px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .row p{margin:0;font-weight:600}
  .switch{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px;min-width:150px}
  .switch .knob{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18);transition:transform .22s ease, background .22s;opacity:0}
  .switch[data-v="예"] .knob{opacity:1;transform:translateX(0);background:var(--ok)}
  .switch[data-v="아니오"] .knob{opacity:1;transform:translateX(100%);background:var(--no)}
  .switch button{position:relative;z-index:1;border:0;background:none;padding:8px 18px;font-weight:700;color:var(--sub);border-radius:999px}
  .switch[data-v="예"] button[data-v="예"],.switch[data-v="아니오"] button[data-v="아니오"]{color:#fff}
  .switch.locked{pointer-events:none}
  #commentBox{margin-top:12px}
  #commentBox textarea{width:100%;min-height:76px;font:inherit;font-size:16px;padding:10px;border:1.5px solid var(--line);border-radius:10px;resize:vertical}
  #commentBox .lbl{font-size:.82rem;color:var(--no);font-weight:600;margin-bottom:6px}
  #commentPrint{white-space:pre-wrap;font-size:.92rem;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}

  .submit{margin-top:16px;text-align:center}
  .submit p{margin:0 0 10px;font-weight:600}
  #finalBtn{max-width:260px;margin:0 auto}
  #stamp{margin-top:12px;font-size:.8rem;color:var(--sub);text-align:center}

  /* ---------- 팝업 ---------- */
  .modal{position:fixed;inset:0;background:rgba(15,20,35,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
  .panel{background:#fff;border-radius:var(--radius);width:100%;max-width:820px;max-height:92svh;display:flex;flex-direction:column;overflow:hidden}
  .panel header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);gap:10px}
  .panel header b{font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .x{border:0;background:var(--soft);width:34px;height:34px;border-radius:50%;font-size:1.1rem;flex:none}
  .panel .body{overflow:auto;-webkit-overflow-scrolling:touch;background:#e9ecf2;padding:10px;flex:1}
  .panel .body canvas,.panel .body img{display:block;width:100%;height:auto;margin:0 auto 10px;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.12)}
  .loading{padding:40px;text-align:center;color:var(--sub)}
  .msg{padding:22px 18px;text-align:center}
  .msg h3{margin:0 0 8px}
  .msg p{margin:0 0 6px;color:var(--sub);font-size:.9rem}

  @media (max-width:520px){
    .wrap{padding:10px 8px 32px}
    #sheet{padding:18px 10px 20px;border-radius:12px}
    table{font-size:.84rem}
    th,td{padding:9px 3px}
    th{font-size:.78rem}
    td.title{padding-left:6px}
    .view{padding:5px 7px;font-size:.76rem}
    col.c-no{width:10%} col.c-max{width:12%} col.c-score{width:14%} col.c-view{width:18%}
    .row{justify-content:center;text-align:center}
    .modal{padding:0}
    .panel{max-width:none;max-height:none;height:100svh;border-radius:0}
  }
</style>
</head>
<body>

<!-- 로그인 화면 -->
<section id="login">
  <form class="card" id="loginForm" autocomplete="off">
    <h1 id="loginTitle">수행평가 점수 확인</h1>
    <p class="sub" id="loginSub"></p>
    <label for="name">이름</label>
    <input id="name" type="text" maxlength="3" placeholder="이름 3글자" required>
    <label for="pw">비밀번호</label>
    <div class="pw">
      <input id="pw" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="11" placeholder="휴대전화번호 11자리" required>
      <button type="button" id="pwToggle">보기</button>
    </div>
    <div class="hint">하이픈(-) 없이 숫자만 입력하세요. 예) 01012345678</div>
    <button class="btn" id="loginBtn" type="submit">로그인</button>
    <div class="err" id="loginErr"></div>
  </form>
</section>

<!-- 점수 확인 화면 -->
<section id="main" class="hidden">
  <div class="wrap">
    <div class="topbar">
      <span class="who" id="who"></span>
      <button class="ghost" id="logout">로그아웃</button>
    </div>

    <div id="sheet">
      <div class="sheet-title">
        <h1 id="sheetTitle"></h1>
        <p id="sheetSub"></p>
      </div>

      <h2>인적사항</h2>
      <table>
        <thead><tr><th>소속교</th><th>학번</th><th>이름</th></tr></thead>
        <tbody><tr><td id="pSchool"></td><td id="pSid"></td><td id="pName"></td></tr></tbody>
      </table>

      <h2>수행평가 결과</h2>
      <table>
        <colgroup><col class="c-no"><col class="c-name"><col class="c-max"><col class="c-score"><col class="c-view"></colgroup>
        <thead><tr><th>구분</th><th>수행평가명</th><th>만점</th><th>점수</th><th>세부내용</th></tr></thead>
        <tbody id="scoreBody"></tbody>
      </table>
      <p class="note" id="pendingNote"></p>

      <div class="confirm">
        <div class="row">
          <p>점수 확인에 이상이 없습니다.</p>
          <div class="switch" id="agree" role="radiogroup" aria-label="점수 확인">
            <span class="knob"></span>
            <button type="button" role="radio" data-v="예">예</button>
            <button type="button" role="radio" data-v="아니오">아니오</button>
          </div>
        </div>
        <div id="commentBox" class="hidden">
          <div class="lbl">이상이 있는 부분을 적어 주세요. (선택)</div>
          <textarea id="comment" placeholder="예) 2번 수행평가 점수가 통지표와 다릅니다."></textarea>
          <div id="commentPrint" class="hidden"></div>
        </div>

        <div class="submit">
          <p>확인 내용을 제출합니다.</p>
          <button class="btn" id="finalBtn" disabled data-html2canvas-ignore>최종</button>
          <div id="stamp"></div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- 팝업 -->
<div class="modal hidden" id="modal" role="dialog" aria-modal="true">
  <div class="panel">
    <header><b id="modalTitle"></b><button class="x" id="modalClose" aria-label="닫기">✕</button></header>
    <div class="body" id="modalBody"></div>
  </div>
</div>

<script>
(() => {
  const S = window.SITE;
  const $ = id => document.getElementById(id);
  const enc = new TextEncoder();
  let student = null, key = null, fid = null;

  $('loginTitle').textContent = S.title || '수행평가 점수 확인';
  $('loginSub').textContent = S.subtitle || '';
  $('sheetTitle').textContent = S.title || '';
  $('sheetSub').textContent = S.subtitle || '';

  /* ---------- 암호화 파일 불러오기 ---------- */
  function loadBlob(file) {
    // <script> 방식이라 내 PC에서 파일을 더블클릭해 열어도 동작합니다.
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      window.__D = (_id, payload) => resolve(payload);
      s.src = 'data/' + file + '.js?t=' + Date.now();
      s.onerror = () => reject(new Error('notfound'));
      s.onload = () => s.remove();
      document.head.appendChild(s);
    });
  }
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function open(payload) {
    const raw = b64(payload);
    return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv: raw.slice(0,12)}, key, raw.slice(12)));
  }
  const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');

  async function derive(name, phone) {
    const base = await crypto.subtle.importKey('raw', enc.encode(name + phone), 'PBKDF2', false, ['deriveBits']);
    const salt = Uint8Array.from(S.salt.match(/../g).map(h => parseInt(h,16)));
    const bits = await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt, iterations:S.iterations}, base, 384);
    const k = await crypto.subtle.importKey('raw', bits.slice(0,32), 'AES-GCM', false, ['decrypt']);
    return { key:k, fid: hex(bits.slice(32,48)) };
  }

  /* ---------- 로그인 ---------- */
  $('pwToggle').onclick = () => {
    const p = $('pw'); const show = p.type === 'password';
    p.type = show ? 'text' : 'password'; $('pwToggle').textContent = show ? '숨기기' : '보기';
  };
  $('pw').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g,'').slice(0,11); });

  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const name = $('name').value.replace(/\s/g,'').normalize('NFC');
    const phone = $('pw').value.replace(/\D/g,'');
    const err = $('loginErr'); err.textContent = '';
    if (name.length !== 3) { err.textContent = '이름 3글자를 입력하세요.'; return; }
    if (phone.length !== 11) { err.textContent = '비밀번호는 휴대전화번호 11자리입니다.'; return; }
    if (!window.crypto || !crypto.subtle) { err.textContent = '보안 연결(https)에서 접속해 주세요.'; return; }
    const btn = $('loginBtn'); btn.disabled = true; btn.textContent = '확인 중…';
    try {
      ({ key, fid } = await derive(name, phone));
      const payload = await loadBlob(fid);
      student = JSON.parse(new TextDecoder().decode(await open(payload)));
      render();
    } catch (ex) {
      err.textContent = '이름 또는 비밀번호가 올바르지 않습니다.';
      key = fid = null;
    } finally { btn.disabled = false; btn.textContent = '로그인'; }
  });

  $('logout').onclick = () => location.reload();

  /* ---------- 결과 화면 ---------- */
  function render() {
    $('login').classList.add('hidden'); $('main').classList.remove('hidden');
    $('pw').value = '';
    $('who').textContent = `${student.name} 학생`;
    $('pSchool').textContent = student.school; $('pSid').textContent = student.sid; $('pName').textContent = student.name;

    const tb = $('scoreBody'); tb.innerHTML = '';
    let sum = 0, maxSum = 0; const pend = [];
    S.assessments.forEach(a => {
      const v = student.scores[a.code]; const has = v !== null && v !== undefined;
      maxSum += a.max; if (has) sum += v; else pend.push(a.no);
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${a.no}</td><td class="title"></td><td>${a.max}</td>
        <td>${has ? `<span class="score">${v}</span>` : '<span class="pending">미공개</span>'}</td>
        <td><button class="view" ${student.files[a.code] ? '' : 'disabled'}>${student.files[a.code] ? '보기' : '준비 중'}</button></td>`;
      tr.querySelector('.title').textContent = a.title;
      if (student.files[a.code]) tr.querySelector('.view').onclick = () => showPdf(a);
      tb.appendChild(tr);
    });
    const tr = document.createElement('tr'); tr.className = 'total';
    tr.innerHTML = `<td colspan="2">총점</td><td>${maxSum}</td><td><span class="score">${sum}</span></td><td></td>`;
    tb.appendChild(tr);
    const g = document.createElement('tr'); g.className = 'total';
    const grade = pend.length ? null : (sum >= 90 ? 'A' : sum >= 80 ? 'B' : sum >= 70 ? 'C' : sum >= 60 ? 'D' : 'E');
    g.innerHTML = `<td colspan="2">성취도</td><td></td><td>${grade ? `<span class="score">${grade}</span>` : '<span class="pending">산출 예정</span>'}</td><td></td>`;
    tb.appendChild(g);
    $('pendingNote').textContent = pend.length ? `※ ${pend.join(', ')}번 수행평가는 결과가 공개되면 총점에 반영됩니다.` : '';
  }

  /* ---------- 통지표 팝업 (PDF.js) ---------- */
  let pdfjsReady = null;
  function loadScript(src) {
    return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  }
  function ensurePdfjs() {
    // 워커를 메인 스레드에서 실행 → 내 PC(file://)와 웹 모두에서 동작
    pdfjsReady ??= loadScript('lib/pdf.min.js').then(() => loadScript('lib/pdf.worker.min.js'));
    return pdfjsReady;
  }
  function openModal(title) {
    $('modalTitle').textContent = title; $('modalBody').innerHTML = '';
    $('modal').classList.remove('hidden'); document.body.style.overflow = 'hidden';
  }
  function closeModal() { $('modal').classList.add('hidden'); document.body.style.overflow = ''; $('modalBody').innerHTML = ''; }
  $('modalClose').onclick = closeModal;
  $('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  async function showPdf(a) {
    openModal(`${a.no}. ${a.title} 통지표`);
    const body = $('modalBody');
    body.innerHTML = '<div class="loading">통지표를 불러오는 중…</div>';
    try {
      const [, payload] = await Promise.all([ensurePdfjs(), loadBlob(`${fid}_${a.code}`)]);
      const bytes = await open(payload);
      const doc = await pdfjsLib.getDocument({ data: bytes, isEvalSupported:false }).promise;
      body.innerHTML = '';
      const width = Math.min(body.clientWidth - 20, 800);
      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      for (let i = 1; i <= doc.numPages; i++) {
        const page = await doc.getPage(i);
        const base = page.getViewport({ scale: 1 });
        const vp = page.getViewport({ scale: (width / base.width) * dpr * 1.5 });  // 확대해도 선명하게
        const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
        body.appendChild(c);
        await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
      }
    } catch (ex) {
      console.error(ex);
      body.innerHTML = '<div class="loading">통지표를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</div>';
    }
  }

  /* ---------- 예/아니오 스위치 ---------- */
  const sw = $('agree');
  sw.querySelectorAll('button').forEach(b => b.onclick = () => {
    sw.dataset.v = b.dataset.v;
    sw.querySelectorAll('button').forEach(x => x.setAttribute('aria-checked', x === b));
    $('commentBox').classList.toggle('hidden', b.dataset.v !== '아니오');
    $('finalBtn').disabled = false;
  });

  /* ---------- 최종 제출 ---------- */
  const pad = n => String(n).padStart(2,'0');
  const nowStr = d => `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;

  $('finalBtn').onclick = async () => {
    const agree = sw.dataset.v; if (!agree) return;
    const btn = $('finalBtn'); btn.disabled = true; btn.textContent = '제출 중…';
    const comment = $('comment').value.trim();
    const when = new Date();

    // 캡처용 화면 정리: 입력칸 → 글자, 제출 시각 표시
    $('comment').classList.add('hidden');
    const cp = $('commentPrint'); cp.textContent = comment || '(작성 내용 없음)'; cp.classList.remove('hidden');
    $('stamp').textContent = `제출 시각: ${nowStr(when)}`;
    sw.classList.add('locked');
    btn.textContent = '최종';

    try {
      const canvas = await html2canvas($('sheet'), { scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false });
      const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
      const fileName = `수행평가확인_${student.sid}_${student.name}.jpg`;
      btn.textContent = '전송 중…';

      if (S.endpoint) {
        let res;
        try {
          res = await fetch(S.endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              name: student.name, school: student.school, sid: student.sid,
              agree, comment, submittedAt: nowStr(when), fileName,
              image: dataUrl.split(',')[1]
            })
          });
        } catch (netErr) { throw new Error('인터넷 연결을 확인해 주세요.'); }
        const text = await res.text();
        let r = null; try { r = JSON.parse(text); } catch (_) {}
        if (!r) throw new Error('메일 서버 설정 오류입니다. 선생님께 알려 주세요. (응답 형식 오류)');
        if (!r.ok) throw new Error('메일 전송 실패: ' + (r.error || '알 수 없는 오류'));
        showDone(dataUrl, true);
      } else {
        // 메일 주소(endpoint)가 아직 연결되지 않은 샘플 모드
        const a = document.createElement('a'); a.href = dataUrl; a.download = fileName; a.click();
        showDone(dataUrl, false);
      }
      btn.textContent = '제출 완료';
    } catch (ex) {
      console.error(ex);
      alert('제출에 실패했습니다.\n' + (ex.message || '') + '\n잠시 후 다시 눌러 주세요.');
      btn.disabled = false; btn.textContent = '최종';
      sw.classList.remove('locked'); $('comment').classList.remove('hidden'); cp.classList.add('hidden'); $('stamp').textContent = '';
    }
  };

  function showDone(dataUrl, sent) {
    openModal(sent ? '제출 완료' : '샘플 모드');
    $('modalBody').innerHTML = `<div class="msg" style="background:#fff;border-radius:10px;margin-bottom:10px">
      <h3>${sent ? '확인 내용이 제출되었습니다.' : '제출 화면 미리보기'}</h3>
      <p>${sent ? '선생님께 아래 화면이 전송되었습니다.' : '메일 전송이 아직 연결되지 않아 이미지를 내려받았습니다.'}</p></div>`;
    const img = new Image(); img.src = dataUrl; img.alt = '제출된 화면'; $('modalBody').appendChild(img);
  }
})();
</script>
<script src="lib/html2canvas.min.js" defer></script>
</body>
</html>
